name: Build Food Triple Match APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository files
    uses: actions/checkout@v4

  - name: Find and extract project ZIP
    run: |
      ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
      if [ -z "$ZIP" ]; then
        echo "No project ZIP found in repository"
        exit 1
      fi
      mkdir -p extracted
      unzip -q "$ZIP" -d extracted
      echo "Extracted project:"
      find extracted -maxdepth 3 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build Android APK
    run: |
      GRADLE_FILE=$(find extracted -name gradlew -type f | head -n 1)
      if [ -z "$GRADLE_FILE" ]; then
        echo "Gradle wrapper not found in ZIP"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLE_FILE")
      chmod +x "$GRADLE_FILE"
      cd "$PROJECT_DIR"
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: food-triple-match-apk
      path: extracted/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
